name: ESLint Scanner

on:
  pull_request:
    branches: [main, develop]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  api-eslint-scan:
    name: API ESLint Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install
        run: npm ci

      - name: Generate JSON report
        run: npm run lint:json

      - name: Lint (SARIF)
        run: npm run lint:sarif

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: apps/api/eslint-report.sarif
          category: api-eslint

      - name: Upload lint artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-eslint-reports
          path: |
            apps/api/eslint-report.sarif
            apps/api/eslint-report.json

      - name: Publish formatted lint summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'apps/api/eslint-report.json';
            const marker = '<!-- eslint-report:api -->';

            let report = [];
            if (fs.existsSync(path)) {
              report = JSON.parse(fs.readFileSync(path, 'utf8'));
            }

            const issues = [];
            let errorCount = 0;
            let warningCount = 0;
            for (const file of report) {
              errorCount += file.errorCount || 0;
              warningCount += file.warningCount || 0;
              for (const msg of file.messages || []) {
                issues.push({
                  filePath: file.filePath?.replace(process.cwd() + '/', '') || file.filePath || '',
                  line: msg.line || 0,
                  column: msg.column || 0,
                  severity: msg.severity === 2 ? 'error' : 'warning',
                  ruleId: msg.ruleId || 'n/a',
                  message: (msg.message || '').replace(/\|/g, '\\|'),
                });
              }
            }

            const top = issues.slice(0, 20);
            let body = `${marker}\n### API ESLint Report\n\n`;
            body += `- Errors: **${errorCount}**\n`;
            body += `- Warnings: **${warningCount}**\n\n`;
            if (top.length) {
              body += '| Severity | Rule | Location | Message |\n';
              body += '| --- | --- | --- | --- |\n';
              for (const i of top) {
                body += `| ${i.severity} | ${i.ruleId} | ${i.filePath}:${i.line}:${i.column} | ${i.message} |\n`;
              }
              if (issues.length > top.length) {
                body += `\nShowing first ${top.length} of ${issues.length} issue(s).\n`;
              }
            } else {
              body += 'No lint issues found.\n';
            }

            await core.summary.addRaw(body).write();

            if (context.eventName === 'pull_request') {
              const issue_number = context.issue.number;
              const { owner, repo } = context.repo;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100,
              });
              const existing = comments.find((c) => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            }

      - name: Enforce lint check
        run: npm run lint:check

