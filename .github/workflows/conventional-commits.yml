name: Conventional Commits

on:
  pull_request:
    branches: [main, develop]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-commit-messages:
    name: Commit Message Validation
    runs-on: ubuntu-latest
    steps:
      - name: Validate commits follow conventional commits
        uses: actions/github-script@v7
        with:
          script: |
            const pattern = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+/;
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const invalid = commits
              .map((c) => ({ sha: c.sha.substring(0, 7), subject: (c.commit.message || '').split('\n')[0] }))
              .filter((c) => !pattern.test(c.subject));

            if (invalid.length > 0) {
              const details = invalid.map((c) => `- ${c.sha}: ${c.subject}`).join('\n');
              core.setFailed(`Conventional commit validation failed for:\n${details}`);
            }

  validate-pr-title:
    name: PR Title Validation
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Validate PR title follows conventional commits
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
