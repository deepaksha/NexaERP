name: ESLint Auto Fix

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  autofix:
    name: Run ESLint auto-fix and open PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node for API
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install API deps
        working-directory: apps/api
        run: npm ci

      - name: Setup Node for Web
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web deps
        working-directory: apps/web
        run: npm ci

      - name: Auto-fix API lint issues
        working-directory: apps/api
        run: npm run lint:fix

      - name: Auto-fix Web lint issues
        working-directory: apps/web
        run: npm run lint:fix

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(lint): auto-fix eslint issues"
          title: "chore(lint): auto-fix eslint issues"
          body: |
            This PR was created automatically by the ESLint Auto Fix workflow.

            Changes:
            - Run ESLint auto-fix in `apps/api`
            - Run ESLint auto-fix in `apps/web`
          branch: chore/eslint-autofix
          delete-branch: true
